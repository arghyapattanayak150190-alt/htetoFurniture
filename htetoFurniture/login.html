<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Hecto Furniture Studio — Admin Portal Login. Manage your premium furniture inventory, architectural rules, and curated orders.">
  <title>Hecto — Admin Portal Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="login-page">
    <!-- Hero Image Side -->
    <div class="login-hero">
      <img src="images/login-hero.jpg" alt="Hecto Furniture Studio workspace">
      <div class="login-hero-overlay">
        <h2>Generational Craftsmanship meets Studio Control</h2>
        <p>Manage your premium furniture inventory, architectural rules, and curated orders from a singular workspace.
        </p>
      </div>
    </div>

    <!-- Login Form Side -->
    <div class="login-form-side">
      <div class="login-branding">
        <h1>Hecto</h1>
        <p>Studio Administration</p>
      </div>

      <div class="login-card">
        <h2>Admin Portal</h2>

        <form id="login-form">
          <div class="form-group">
            <label for="email">EMAIL ADDRESS</label>
            <input type="email" id="email" class="form-input" autocomplete="username"
              placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" class="form-input" autocomplete="current-password"
              placeholder="Enter your password" minlength="8" required>
          </div>

          <div class="login-extras">
            <label>
              <input type="checkbox" id="remember-me">
              Remember me
            </label>
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-login" id="btn-sign-in">SIGN IN TO PORTAL</button>
        </form>
      </div>
    </div>
  </div>
  <script src="js/app.js" defer></script>
</body>

</html>
